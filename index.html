<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 32px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 2rem;
            color: #111827;
        }

        p {
            margin-top: 0;
            margin-bottom: 24px;
            color: #4b5563;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            resize: vertical;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .actions {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .secondary:hover {
            background: #d1d5db;
        }

        #result {
            margin-top: 24px;
            padding: 18px;
            border-radius: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            min-height: 60px;
            white-space: pre-wrap;
        }

        .loading {
            color: #4338ca;
            font-weight: bold;
        }
    </style>

    <script>
        function RunSentimentAnalysis() {
            const text = document.getElementById("textToAnalyze").value.trim();
            const result = document.getElementById("result");

            if (!text) {
                result.innerText = "Please enter some text first.";
                return;
            }

            result.innerHTML = '<span class="loading">Analyzing emotion...</span>';

            fetch(`/emotionDetector?textToAnalyze=${encodeURIComponent(text)}`)
                .then(response => response.text())
                .then(data => {
                    result.innerText = data;
                })
                .catch(error => {
                    result.innerText = "An error occurred: " + error;
                });
        }

        function clearText() {
            document.getElementById("textToAnalyze").value = "";
            document.getElementById("result").innerText = "";
        }
    </script>
</head>
<body>
    <div class="card">
        <h1>Emotion Detector</h1>
        <p>Type a sentence below and analyze the emotional tone of the text.</p>

        <label for="textToAnalyze">Enter text</label>
        <textarea id="textToAnalyze" placeholder="Example: I am excited because I finally solved the problem."></textarea>

        <div class="actions">
            <button onclick="RunSentimentAnalysis()">Analyze Emotion</button>
            <button class="secondary" onclick="clearText()">Clear</button>
        </div>

        <div id="result">Your result will appear here.</div>
    </div>
</body>
</html>
